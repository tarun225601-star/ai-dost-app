name: Flutter APK Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Ultimate Safe Clean & Recreate Android
        run: |
          # 1. अपनी असली फाइलों का सुरक्षित बैकअप ले लो
          mkdir -p /tmp/my_app_backup
          cp pubspec.yaml /tmp/my_app_backup/
          cp -r lib /tmp/my_app_backup/

          # 2. पुराने और सड़े हुए एंड्रॉइड/आईओएस फोल्डर को हमेशा के लिए उड़ा दो
          rm -rf android ios

          # 3. एकदम नया, चकाचक v2 एंड्रॉइड प्रोजेक्ट फ्रेश बनाओ
          flutter create . --platforms=android --project-name=ai_dost

          # 4. अपनी असली डिपेंडेंसी (pubspec.yaml) और कोड (lib) वापस अपनी जगह चिपकाओ
          cp /tmp/my_app_backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/my_app_backup/lib lib

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
