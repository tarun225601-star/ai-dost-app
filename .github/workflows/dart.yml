name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Clone Flutter
        run: git clone https://github.com/flutter/flutter.git --branch stable --depth 1 ~/flutter

      - name: Add Flutter to Path
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies & Build
        run: |
          cd ai-dost-app
          flutter pub get
          flutter analyze
          flutter build apk --release
