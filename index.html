<!-- Viziya 2050 Social Feed, Posts & Follow/Unfollow Module -->
<div class="container" style="width: 100%; max-width: 380px; margin: auto; padding: 18px; background: rgba(18, 24, 38, 0.9); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 20px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); color: #fff; margin-top: 15px;">
    
    <h3 style="font-size: 14px; color: #00f0ff; letter-spacing: 1px; margin-bottom: 12px;">📸 VIZIYA SOCIAL FEED</h3>

    <!-- 1. Create Post Box (Photo/Video URL & Caption) -->
    <div style="background: rgba(0,0,0,0.5); padding: 12px; border-radius: 12px; border: 1px solid rgba(0,240,255,0.2); margin-bottom: 15px;">
        <input type="text" id="postMediaUrl" placeholder="Paste Image / Video URL..." style="width: 100%; padding: 8px; background: #000; border: 1px solid rgba(0,240,255,0.3); border-radius: 8px; color: #fff; font-size: 12px; outline: none; margin-bottom: 8px;">
        <input type="text" id="postCaption" placeholder="Write a caption about your 2050 Vibe..." style="width: 100%; padding: 8px; background: #000; border: 1px solid rgba(0,240,255,0.3); border-radius: 8px; color: #fff; font-size: 12px; outline: none; margin-bottom: 8px;">
        <button onclick="createNewPost()" style="width: 100%; padding: 8px; background: linear-gradient(135deg, #00f0ff, #0077ff); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; text-transform: uppercase;">Publish Post</button>
    </div>

    <!-- 2. Suggested Users to Follow / Unfollow -->
    <div style="margin-bottom: 15px;">
        <span style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 6px;">Discover Creators</span>
        <div id="creatorList" style="display: flex; flex-direction: column; gap: 8px;">
            <!-- Dynamic Creators injected via JS -->
        </div>
    </div>

    <!-- 3. Dynamic Feed Stream -->
    <div>
        <span style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 6px;">Live Feed</span>
        <div id="feedContainer" style="display: flex; flex-direction: column; gap: 12px; max-height: 250px; overflow-y: auto;">
            <!-- Dynamic Posts injected via JS -->
        </div>
    </div>

</div>

<script>
    // Initial Mock Creators & Posts Data stored in LocalStorage
    let creators = JSON.parse(localStorage.getItem('vizia_creators')) || [
        { id: 'c1', name: 'Aura Tech', handle: '@auratech', isFollowing: false },
        { id: 'c2', name: 'Quantum Design', handle: '@q_design', isFollowing: true }
    ];

    let posts = JSON.parse(localStorage.getItem('vizia_posts')) || [
        { user: 'Aura Tech', handle: '@auratech', media: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400', caption: 'Testing the 2050 Empathic Mirror interface! 🚀' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
        renderCreators();
        renderFeed();
    });

    // Follow / Unfollow Toggle Logic
    function toggleFollow(index) {
        creators[index].isFollowing = !creators[index].isFollowing;
        localStorage.setItem('vizia_creators', JSON.stringify(creators));
        renderCreators();
    }

    function renderCreators() {
        const container = document.getElementById('creatorList');
        container.innerHTML = '';
        creators.forEach((c, idx) => {
            container.innerHTML += `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 8px 10px; border-radius: 8px; font-size: 12px;">
                    <div>
                        <strong style="display: block; color: #fff;">${c.name}</strong>
                        <span style="font-size: 10px; color: #00f0ff;">${c.handle}</span>
                    </div>
                    <button onclick="toggleFollow(${idx})" style="padding: 4px 10px; border-radius: 6px; border: 1px solid ${c.isFollowing ? '#94a3b8' : '#00f0ff'}; background: ${c.isFollowing ? 'transparent' : 'rgba(0,240,255,0.1)'}; color: ${c.isFollowing ? '#94a3b8' : '#00f0ff'}; cursor: pointer; font-size: 11px;">
                        ${c.isFollowing ? 'Following' : 'Follow'}
                    </button>
                </div>
            `;
        });
    }

    // Create New Post Logic
    function createNewPost() {
        const mediaUrl = document.getElementById('postMediaUrl').value.trim();
        const caption = document.getElementById('postCaption').value.trim();
        const myName = localStorage.getItem('vizia_profile_name') || 'Tarun Viziya';
        const myHandle = localStorage.getItem('vizia_profile_handle') || '@viziya_global';

        if(!mediaUrl && !caption) {
            alert("Please add at least an image URL or caption to post.");
            return;
        }

        const newPost = {
            user: myName,
            handle: myHandle,
            media: mediaUrl || 'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=400',
            caption: caption || 'My new Viziya drop!'
        };

        posts.unshift(newPost);
        localStorage.setItem('vizia_posts', JSON.stringify(posts));

        document.getElementById('postMediaUrl').value = '';
        document.getElementById('postCaption').value = '';
        renderFeed();
        alert("✓ Post published successfully to Viziya Network!");
    }

    function renderFeed() {
        const container = document.getElementById('feedContainer');
        container.innerHTML = '';
        posts.forEach(p => {
            container.innerHTML += `
                <div style="background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden;">
                    <div style="padding: 8px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);">
                        <div style="width: 24px; height: 24px; border-radius: 50%; background: #00f0ff; color: #000; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center;">${p.user.charAt(0)}</div>
                        <div>
                            <span style="font-size: 11px; font-weight: bold; display: block; color: #fff;">${p.user}</span>
                            <span style="font-size: 9px; color: #00f0ff;">${p.handle}</span>
                        </div>
                    </div>
                    <img src="${p.media}" style="width: 100%; max-height: 180px; object-fit: cover; display: block;" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400'">
                    <div style="padding: 8px 10px; font-size: 11px; color: #e2e8f0;">
                        <span style="font-weight: bold; color: #fff; margin-right: 5px;">${p.user}</span>${p.caption}
                    </div>
                </div>
            `;
        });
    }
</script>
