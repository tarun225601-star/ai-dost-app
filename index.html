<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>तरुण एआई - Ultimate Scam Shield & Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0B0F19; color: #F8FAFC; font-family: sans-serif; }
        #sidebar {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        #sidebar.open {
            transform: translateX(0);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 25px rgba(99, 102, 241, 0); }
            100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
        .tarun-mic-pulse { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body class="flex flex-col h-screen justify-between overflow-hidden">

    <!-- SIDEBAR DRAWER (Menu Bar) -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden"></div>
    <div id="sidebar" class="fixed inset-y-0 left-0 w-80 bg-[#111827] border-r border-slate-800 z-50 flex flex-col justify-between p-5 shadow-2xl">
        <div class="space-y-5 overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-indigo-400"></i> तरुण एआई मेनू
                </h2>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Mode Selector -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-400">🛡️ एआई का काम करने का मोड:</label>
                <select id="app-mode-select" onchange="changeAppMode()" class="w-full bg-[#1F2937] text-slate-100 text-xs rounded-xl p-2.5 border border-slate-700 focus:outline-none">
                    <option value="chat">💬 सामान्य चैट मोड (General Chat)</option>
                    <option value="scam_guard">🚨 स्कैम & फ्रॉड गार्ड (Scam Shield)</option>
                    <option value="business">🏢 बिजनेस & दुकान सलाहकार मोड</option>
                </select>
            </div>

            <!-- Language Selector -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-400">🌐 बातचीत की भाषा (Language):</label>
                <select id="app-lang-select" onchange="saveLanguage()" class="w-full bg-[#1F2937] text-slate-100 text-xs rounded-xl p-2.5 border border-slate-700 focus:outline-none">
                    <option value="Auto (Detect and reply in user's language)">🔄 ऑटो-डिटेक्ट (यूजर की भाषा)</option>
                    <option value="Hindi">🇮🇳 हिंदी (Hindi)</option>
                    <option value="English">🇬🇧 अंग्रेजी (English)</option>
                    <option value="Haryanvi">🇮🇳 हरियाणवी / लोकल टोन</option>
                </select>
            </div>

            <!-- Business & Prompt Settings -->
            <div id="business-config-section" class="space-y-3 pt-2 border-t border-slate-800">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-green-400">🏢 दुकान / बिजनेस का नाम:</label>
                    <input type="text" id="business-type-input" autocomplete="off" placeholder="जैसे: General Store..." 
                        class="w-full bg-[#1F2937] text-slate-100 text-xs rounded-xl p-2.5 border border-slate-700 focus:outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-indigo-400">✍️ कस्टम नियम या रेट लिस्ट:</label>
                    <textarea id="custom-prompt-input" rows="2" autocomplete="off" placeholder="यहाँ नियम लिखें..."
                        class="w-full bg-[#1F2937] text-slate-100 text-xs rounded-xl p-2.5 border border-slate-700 focus:outline-none"></textarea>
                </div>
                <button onclick="saveBusinessConfig()" class="w-full bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 rounded-xl transition">
                    सेव करें
                </button>
            </div>

            <!-- API Key Settings -->
            <div class="space-y-1.5 pt-2 border-t border-slate-800">
                <label class="text-xs font-semibold text-slate-400">🔑 Groq API Key:</label>
                <input type="password" id="groq-key-input" autocomplete="off" placeholder="gsk_..." 
                    class="w-full bg-[#1F2937] text-slate-100 text-xs rounded-xl p-2.5 border border-slate-700 focus:outline-none">
                <button onclick="saveApiKey()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-xl transition">
                    API Key सेव करें
                </button>
            </div>
        </div>
        <div class="text-center text-[10px] text-slate-500 pt-3 border-t border-slate-800">
            तरुण एआई Pro v3.1 • Direct Shield Active
        </div>
    </div>

    <!-- TOP HEADER -->
    <header class="bg-[#0B0F19] border-b border-slate-800/60 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="text-slate-300 hover:text-white p-2 rounded-lg hover:bg-slate-800">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2">
                <span class="text-sm font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent" id="header-title">तरुण एआई</span>
                <i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="clearCurrentHistory()" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800" title="चैट क्लियर करें">
                <i class="fa-solid fa-pen-to-square text-lg"></i>
            </button>
        </div>
    </header>

    <!-- QUICK ACTION BANNER (Direct Front Screen Scam/UPI Check Button) -->
    <div class="bg-gradient-to-r from-red-900/40 to-indigo-900/40 border-b border-red-500/30 px-4 py-2 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-shield-virus text-red-400 text-base animate-pulse"></i>
            <span class="text-xs text-slate-200 font-medium">फर्जी पेमेंट या स्कैम लिंक चेक करना है?</span>
        </div>
        <button onclick="enableScamModeDirectly()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition shadow-md flex items-center gap-1.5">
            <i class="fa-solid fa-camera"></i> तुरंत स्कैन करें
        </button>
    </div>

    <!-- MAIN CHAT AREA -->
    <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-3 space-y-4">
        <!-- Initial Greeting Message -->
        <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center space-y-3">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-red-500 via-indigo-500 to-pink-500 flex items-center justify-center shadow-lg animate-pulse">
                <i class="fa-solid fa-shield-virus text-white text-lg"></i>
            </div>
            <h2 id="greeting-text" class="text-lg font-medium text-slate-200">नमस्ते! स्कैम गार्ड और तरुण एआई तैयार है।</h2>
        </div>
    </main>

    <!-- Loading Bar -->
    <div id="loading-bar" class="hidden px-4">
        <div class="w-full bg-slate-800 h-1 rounded overflow-hidden">
            <div class="bg-red-500 h-full w-1/2 animate-pulse"></div>
        </div>
    </div>

    <!-- Image Preview Bar -->
    <div id="image-preview-container" class="hidden px-4 py-2 bg-[#111827] border-t border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img id="preview-img" src="" class="w-10 h-10 object-cover rounded-lg border border-slate-700">
            <span class="text-xs text-slate-300">स्कैन के लिए फोटो संलग्न</span>
        </div>
        <button onclick="removeImage()" class="text-red-400 hover:text-red-300 text-xs font-bold px-2 py-1"><i class="fa-solid fa-xmark"></i> हटाएं</button>
    </div>

    <!-- BOTTOM INPUT CONTAINER -->
    <div class="px-4 pt-2 pb-5 bg-[#0B0F19]">
        <div class="bg-[#161F30] border border-slate-700/80 rounded-3xl p-2.5 flex items-center shadow-xl">
            <!-- Hidden File Input -->
            <input type="file" id="image-file-input" accept="image/*" class="hidden" onchange="handleImageSelection(event)">
            
            <!-- Photo / Screenshot Upload Button -->
            <button onclick="document.getElementById('image-file-input').click()" class="text-slate-400 hover:text-indigo-400 px-3 py-1 rounded-full transition" title="संदिग्ध फोटो या स्क्रीनशॉट अपलोड करें">
                <i class="fa-solid fa-camera text-lg"></i>
            </button>

            <!-- Text Input -->
            <input type="text" id="user-input" autocomplete="off" placeholder="संदिग्ध मैसेज यहाँ पेस्ट करें या पूछें..." 
                class="flex-1 bg-transparent text-slate-100 placeholder-slate-400 text-sm px-3 py-2 focus:outline-none">

            <!-- Mic Voice Live Button -->
            <button onclick="openVoiceOverlay()" class="text-indigo-400 hover:text-indigo-300 px-3 py-1 rounded-full transition" title="वॉइस बोलकर पूछें">
                <i class="fa-solid fa-microphone-lines text-xl"></i>
            </button>

            <!-- Send Button -->
            <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-10 h-10 rounded-full flex items-center justify-center transition shadow-md ml-1 flex-shrink-0">
                <i class="fa-solid fa-arrow-up text-sm"></i>
            </button>
        </div>
    </div>

    <!-- VOICE OVERLAY MODAL -->
    <div id="voice-overlay" class="fixed inset-0 bg-[#0B0F19]/95 z-50 hidden flex flex-col justify-between p-6 text-center">
        <div class="flex justify-between items-center">
            <span class="text-xs font-bold tracking-widest text-indigo-400 uppercase">तरुण एआई लाइव वॉइस</span>
            <button onclick="closeVoiceOverlay()" class="text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div class="flex flex-col items-center justify-center space-y-6 my-auto">
            <div id="voice-status-text" class="text-xl font-medium text-slate-200">सुन रहा हूँ, बोलिए...</div>
            <div class="relative flex items-center justify-center my-6">
                <div class="w-28 h-28 rounded-full bg-indigo-600/30 absolute tarun-mic-pulse"></div>
                <div class="w-20 h-20 rounded-full bg-indigo-600 flex items-center justify-center text-white text-3xl shadow-2xl relative z-10">
                    <i class="fa-solid fa-microphone"></i>
                </div>
            </div>
            <div id="voice-transcript" class="text-sm text-slate-400 italic max-w-xs">बोलिए, तरुण एआई सुन रहा है...</div>
        </div>
        <div class="flex justify-center pb-4">
            <button onclick="closeVoiceOverlay()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-6 py-3 rounded-full font-bold transition">
                वॉइस बंद करें
            </button>
        </div>
    </div>

    <!-- Hidden Silent Audio Player -->
    <audio id="silent-audio" loop preload="auto">
        <source src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentMode = 'chat'; 
        let chatMessages = [];
        let scamMessages = [];
        let bizMessages = [];
        let activeBusinessName = "";
        let activeSystemPrompt = "";
        let selectedLanguage = "Auto (Detect and reply in user's language)";
        let wakeLock = null;
        let base64Image = null;
        let recognition = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log(err); }
        }

        function startSilentAudioLoop() {
            const audio = document.getElementById('silent-audio');
            audio.play().catch(e => console.log(e));
        }

        window.onload = function() {
            requestWakeLock();
            startSilentAudioLoop();

            document.addEventListener('click', () => {
                startSilentAudioLoop();
            }, { once: true });

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'hi-IN';
                recognition.interimResults = true;
                recognition.maxAlternatives = 1;

                recognition.onresult = (event) => {
                    const speechText = event.results[0][0].transcript;
                    document.getElementById('voice-transcript').innerText = `"${speechText}"`;
                    if (event.results[0].isFinal) {
                        document.getElementById('user-input').value = speechText;
                        closeVoiceOverlay();
                        sendMessage();
                    }
                };
                recognition.onerror = () => { document.getElementById('voice-status-text').innerText = "दोबारा बोलें।"; };
                recognition.onend = () => {};
            }

            const savedKey = localStorage.getItem('groq_api_key');
            if (savedKey) document.getElementById('groq-key-input').value = savedKey;

            const savedMode = localStorage.getItem('app_mode') || 'chat';
            document.getElementById('app-mode-select').value = savedMode;
            currentMode = savedMode;

            const savedLang = localStorage.getItem('app_lang');
            if (savedLang) {
                selectedLanguage = savedLang;
                document.getElementById('app-lang-select').value = savedLang;
            }

            loadHistoryData();
            updateUIState();
        };

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.toggle('open');
            backdrop.classList.toggle('hidden');
        }

        function changeAppMode() {
            currentMode = document.getElementById('app-mode-select').value;
            localStorage.setItem('app_mode', currentMode);
            updateUIState();
            loadHistoryData();
            toggleSidebar();
        }

        function enableScamModeDirectly() {
            currentMode = 'scam_guard';
            document.getElementById('app-mode-select').value = 'scam_guard';
            localStorage.setItem('app_mode', 'scam_guard');
            updateUIState();
            loadHistoryData();
            document.getElementById('image-file-input').click();
        }

        function saveLanguage() {
            selectedLanguage = document.getElementById('app-lang-select').value;
            localStorage.setItem('app_lang', selectedLanguage);
            toggleSidebar();
        }

        function updateUIState() {
            const headerTitle = document.getElementById('header-title');
            const greetingText = document.getElementById('greeting-text');
            const userInput = document.getElementById('user-input');

            if (currentMode === 'scam_guard') {
                headerTitle.innerText = "🚨 स्कैम & फ्रॉड गार्ड";
                greetingText.innerText = "कोई भी संदिग्ध मैसेज या पेमेंट स्क्रीनशॉट यहाँ चेक करें!";
                userInput.placeholder = "संदिग्ध SMS, लिंक या पेमेंट का स्क्रीनशॉट दें...";
            } else if (currentMode === 'business') {
                headerTitle.innerText = activeBusinessName ? `Business: ${activeBusinessName}` : "Business Mode";
                greetingText.innerText = "नमस्ते! दुकान और बिजनेस मोड एक्टिव है।";
                userInput.placeholder = "ग्राहक का सवाल या हिसाब पूछें...";
            } else {
                headerTitle.innerText = "तरुण एआई";
                greetingText.innerText = "नमस्ते! आज आपका क्या प्लान है?";
                userInput.placeholder = "तरुण एआई से कहें...";
            }
        }

        function saveBusinessConfig() {
            const bizName = document.getElementById('business-type-input').value.trim();
            const prompt = document.getElementById('custom-prompt-input').value.trim();
            if (!bizName) { alert('दुकान का नाम भरें!'); return; }
            activeBusinessName = bizName;
            activeSystemPrompt = prompt;
            localStorage.setItem('biz_type', bizName);
            localStorage.setItem('biz_prompt', prompt);
            updateUIState();
            alert('✅ बिजनेस सेटिंग्स सेव हो गई!');
            toggleSidebar();
        }

        function saveApiKey() {
            const key = document.getElementById('groq-key-input').value.trim();
            if (!key) { alert('वैध API Key दर्ज करें!'); return; }
            localStorage.setItem('groq_api_key', key);
            alert('✅ API Key सेव हो गई!');
            toggleSidebar();
        }

        function openVoiceOverlay() {
            if (!recognition) { alert('स्पीच रिकग्निशन सपोर्ट नहीं है।'); return; }
            document.getElementById('voice-overlay').classList.remove('hidden');
            document.getElementById('voice-status-text').innerText = "सुन रहा हूँ, बोलिए...";
            try { recognition.start(); } catch(e) {}
        }

        function closeVoiceOverlay() {
            if (recognition) { try { recognition.stop(); } catch(e) {} }
            document.getElementById('voice-overlay').classList.add('hidden');
        }

        function handleImageSelection(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    document.getElementById('preview-img').src = base64Image;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            base64Image = null;
            document.getElementById('image-file-input').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        function speakOutLoud(text) {
            if ('speechSynthesis' in window && (currentMode === 'business' || currentMode === 'scam_guard')) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function getActiveList() {
            if (currentMode === 'scam_guard') return scamMessages;
            if (currentMode === 'business') return bizMessages;
            return chatMessages;
        }

        function loadHistoryData() {
            const sChat = localStorage.getItem('chat_history');
            const sScam = localStorage.getItem('scam_history');
            const sBiz = localStorage.getItem('biz_history');
            chatMessages = sChat ? JSON.parse(sChat) : [];
            scamMessages = sScam ? JSON.parse(sScam) : [];
            bizMessages = sBiz ? JSON.parse(sBiz) : [];
            renderChat();
        }

        function clearCurrentHistory() {
            if (currentMode === 'chat') { chatMessages = []; localStorage.removeItem('chat_history'); }
            else if (currentMode === 'scam_guard') { scamMessages = []; localStorage.removeItem('scam_history'); }
            else { bizMessages = []; localStorage.removeItem('biz_history'); }
            renderChat();
        }

        function renderChat() {
            const container = document.getElementById('chat-container');
            const list = getActiveList();
            
            if (list.length === 0) {
                updateUIState();
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center space-y-3">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-red-500 via-indigo-500 to-pink-500 flex items-center justify-center shadow-lg animate-pulse">
                            <i class="fa-solid fa-shield-halved text-white text-lg"></i>
                        </div>
                        <h2 class="text-lg font-medium text-slate-200">
                            ${currentMode === 'scam_guard' ? '🚨 स्कैम गार्ड एक्टिव: कोई भी संदिग्ध लिंक या पेमेंट चेक करें।' : 'नमस्ते! आज आपका क्या प्लान है?'}
                        </h2>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            list.forEach(msg => {
                const isUser = msg.sender === 'user';
                let imgTag = msg.image ? `<img src="${msg.image}" class="w-32 h-32 object-cover rounded-xl mb-2 border border-slate-700">` : '';
                container.innerHTML += `
                    <div class="flex ${isUser ? 'justify-end' : 'items-start space-x-3'} my-3">
                        ${!isUser ? '<div class="w-7 h-7 rounded-full bg-red-600 flex items-center justify-center text-xs text-white flex-shrink-0"><i class="fa-solid fa-shield-halved"></i></div>' : ''}
                        <div class="${isUser ? 'bg-indigo-600 text-white rounded-2xl rounded-tr-none' : 'bg-[#1F2937] text-slate-100 rounded-2xl rounded-tl-none'} p-3.5 max-w-[85%] text-sm shadow-md space-y-1.5">
                            ${imgTag}
                            <div class="leading-relaxed text-[13.5px]">${msg.text}</div>
                        </div>
                    </div>
                `;
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            startSilentAudioLoop();
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();
            let currentImage = base64Image;

            if (!userText && !currentImage) return;

            const list = getActiveList();
            let userMsg = {'sender': 'user', 'text': userText || '[फोटो/स्क्रीनशॉट भेजा गया]'};
            if (currentImage) userMsg.image = currentImage;

            list.push(userMsg);
            inputField.value = '';
            removeImage();
            saveHistory();
            renderChat();

            document.getElementById('loading-bar').classList.remove('hidden');

            try {
                const groqKey = localStorage.getItem('groq_api_key') || '';
                if (!groqKey) {
                    document.getElementById('loading-bar').classList.add('hidden');
                    list.push({'sender': 'ai', 'text': '⚠️ कृपया पहले साइड मेनू (☰) खोलकर अपनी Groq API Key सेव करें!'});
                    saveHistory(); renderChat(); toggleSidebar();
                    return;
                }

                let sysPrompt = `You are Tarun AI, a helpful assistant. Reply in: ${selectedLanguage}.`;
                if (currentMode === 'scam_guard') {
                    sysPrompt = `You are an expert Fraud and Scam Detector Shield. Analyze the user's message, SMS, link, or payment screenshot. Tell them clearly whether it is 100% FRAUD/SCAM or SAFE. Give reasons why, and warn them if it's dangerous. Reply strictly in: ${selectedLanguage}.`;
                } else if (currentMode === 'business') {
                    sysPrompt = `${activeSystemPrompt || 'You are a business helper.'} Reply in: ${selectedLanguage}.`;
                }

                let userContent = [];
                if (userText) userContent.push({"type": "text", "text": userText});
                if (currentImage) userContent.push({"type": "image_url", "image_url": {"url": currentImage}});

                let activeModel = currentImage ? "llama-3.2-90b-vision-preview" : "llama-3.3-70b-versatile";

                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${groqKey}`,
                    },
                    body: JSON.stringify({
                        "model": activeModel,
                        "messages": [
                            {"role": "system", "content": sysPrompt},
                            {"role": "user", "content": currentImage ? userContent : userText}
                        ],
                    }),
                });

                document.getElementById('loading-bar').classList.add('hidden');

                if (response.ok) {
                    const data = await response.json();
                    let aiResponse = data.choices[0].message.content;
                    list.push({'sender': 'ai', 'text': aiResponse});
                    speakOutLoud(aiResponse);
                } else {
                    const errBody = await response.text();
                    list.push({'sender': 'ai', 'text': `❌ API एरर: ${errBody}`});
                }

                saveHistory();
                renderChat();

            } catch (e) {
                document.getElementById('loading-bar').classList.add('hidden');
                list.push({'sender': 'ai', 'text': `❌ कनेक्शन एरर: ${e}`});
                saveHistory();
                renderChat();
            }
        }

        function saveHistory() {
            if (currentMode === 'chat') localStorage.setItem('chat_history', JSON.stringify(chatMessages));
            else if (currentMode === 'scam_guard') localStorage.setItem('scam_history', JSON.stringify(scamMessages));
            else localStorage.setItem('biz_history', JSON.stringify(bizMessages));
        }
    </script>
</body>
</html>
