<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CID / विजया सीआईडी</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .badge {
            background-color: #f59e0b;
            color: #000;
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .robot-header {
            text-align: center;
            margin-bottom: 15px;
        }
        .robot-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            font-size: 32px;
        }
        .chat-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .ai-msg {
            background-color: #273548;
            border-left: 4px solid var(--accent-red);
        }
        .user-msg {
            background-color: #1e3a8a;
            border-left: 4px solid #60a5fa;
            align-self: flex-end;
            max-width: 85%;
        }
        .input-panel {
            display: flex;
            gap: 10px;
            align-items: center;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .mic-btn {
            background: #ef4444;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }
        .mic-btn.recording {
            animation: pulse 1.2s infinite;
            background: #dc2626;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            height: 24px;
            max-height: 80px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        .send-btn {
            background-color: var(--accent-green);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        .settings-bar {
            background: #111827;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
        }
        .settings-bar input {
            background: #1f2937;
            border: 1px solid var(--border-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            width: 140px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span>🚨 AI CID</span> / <span style="color: #94a3b8; font-size: 0.9rem;">विजया सीआईडी</span>
        </div>
        <div class="badge">LIVE INTERROGATION</div>
    </header>

    <div class="main-container">
        <div class="robot-header">
            <div class="robot-avatar">🤖</div>
            <div style="font-weight: bold; font-size: 1.1rem;">AI CID Live Interrogator</div>
            <div style="font-size: 0.8rem; color: #94a3b8;" id="status-text">असली AI मॉडल कनेक्टेड है। बयान दें!</div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">
                <strong>AI CID:</strong> नमस्ते तरुण भाई! मैं विजया सीआईडी का ऑटोनॉमस जासूस हूँ। आप जो भी बोलेंगे, मैं आपकी असली API Key के जरिए इंटरनेट से वेरीफाई करके बताऊँगा कि बात सच है या झूठ!
            </div>
        </div>

        <div class="input-panel">
            <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="बोलकर टाइप करें">🎙️</button>
            <textarea id="userInput" placeholder="यहाँ अपनी बात टाइप करें..." rows="1" onkeydown="checkEnter(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()">भेजें 🚀</button>
        </div>
    </div>

    <div class="settings-bar">
        <span>API Key:</span>
        <input type="password" id="apiKeyInput" placeholder="अपनी Real API Key यहाँ डालें" onchange="saveApiKey()">
    </div>

    <script>
        // लोड करते ही सेव की गई API Key चेक करना
        window.onload = function() {
            const savedKey = localStorage.getItem('ai_cid_api_key');
            if(savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('ai_cid_api_key', key);
            alert("API Key सुरक्षित सेव हो गई है!");
        }

        function checkEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert("कृपया नीचे सेटिंग्स में अपनी Real API Key दर्ज करें!");
                return;
            }

            // यूजर का मैसेज चैट में जोड़ें
            appendMessage(`तरुण भाई: ${text}`, 'user-msg');
            input.value = '';

            const statusText = document.getElementById('status-text');
            statusText.innerText = "जांच चल रही है (AI سوچ रहा है)...";

            // AI से असली रिस्पॉन्स लाने के लिए फेच कॉल (OpenAI / Grok Compatible Endpoint)
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo", // आप चाहें तो यहाँ अपना मॉडल बदल सकते हैं
                        messages: [
                            {
                                role: "system", 
                                content: "तुम एक सख्त और तेजतर्रार AI CID जासूस (विजया सीआईडी) हो। तरुण भाई तुमसे बात कर रहे हैं। उनके हर बयान को गहराई से परखो। विश्लेषण करो कि उनका बयान सच है या झूठ, और उसका प्रतिशत (%) व सटीक कारण हिंदी में बताओ।"
                            },
                            {
                                role: "user", 
                                content: text
                            }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    const aiReply = data.choices[0].message.content;
                    appendMessage(`AI CID: ${aiReply}`, 'ai-msg');
                } else if (data.error) {
                    appendMessage(`AI CID Error: ${data.error.message}`, 'ai-msg');
                } else {
                    appendMessage(`AI CID: API से अमान्य उत्तर प्राप्त हुआ।`, 'ai-msg');
                }
            } catch (error) {
                appendMessage(`AI CID नेटवर्क त्रुटि: ${error.message}`, 'ai-msg');
            } finally {
                statusText.innerText = "असली AI मॉडल कनेक्टेड है। बयान दें!";
            }
        }

        // वॉइस रिकग्निशन (माइक का असली फीचर)
        let recognition;
        function toggleMic() {
            const micBtn = document.getElementById('micBtn');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("आपका ब्राउज़र वॉइस रिकग्निशन सपोर्ट नहीं करता है। कृपया टाइप करके बात करें।");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN'; // हिंदी भाषा के लिए
            recognition.interimResults = false;

            recognition.onstart = function() {
                micBtn.classList.add('recording');
                document.getElementById('status-text').innerText = "सुन रहा हूँ... बोलिए तरुण भाई!";
            };

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechToText;
                micBtn.classList.remove('recording');
                sendMessage(); // बोलते ही ऑटोमैटिक सेंड हो जाएगा
            };

            recognition.onerror = function() {
                micBtn.classList.remove('recording');
                document.getElementById('status-text').innerText = "माइक की परमिशन या आवाज़ की दिक्कत है।";
            };

            recognition.onend = function() {
                micBtn.classList.remove('recording');
            };

            recognition.start();
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
