<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Portal - Viziag Mart</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #ff5722; color: white; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background: #e64a19; }
        .secondary-btn { background: #555; }
        .hidden { display: none; }
        .switch-text { text-align: center; margin-top: 10px; color: #007bff; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SECTION -->
    <div id="login-section" class="card">
        <h2>Vendor Login</h2>
        <input type="tel" id="login-mobile" placeholder="Registered Mobile Number" maxlength="10">
        <input type="password" id="login-pin" placeholder="Enter Your Secret Password/PIN">
        <button onclick="loginVendor()">Login to My Panel</button>
        <p id="login-error" style="color:red;"></p>
        <div class="switch-text" onclick="showRegister()">नया वेंडर हूँ? यहाँ रजिस्टर करें</div>
    </div>

    <!-- 2. REGISTER / SETUP PIN SECTION -->
    <div id="register-section" class="card hidden">
        <h2>New Vendor Registration</h2>
        <input type="text" id="reg-company" placeholder="Company Name (e.g. JetBlack India)">
        <input type="tel" id="reg-mobile" placeholder="Mobile Number (10 Digits)" maxlength="10">
        <input type="password" id="reg-pin" placeholder="Create Your Own Secret PIN/Password">
        <button onclick="registerVendor()">Register & Set Password</button>
        <p id="reg-error" style="color:red;"></p>
        <div class="switch-text" onclick="showLogin()">पहिले से खाता है? लॉगिन करें</div>
    </div>

    <!-- 3. VENDOR ADMIN PANEL SECTION (Hidden by default) -->
    <div id="admin-section" class="card hidden">
        <h2>Welcome, <span id="display-company-name"></span></h2>
        <p style="font-size: 12px; color: gray;">Mobile: <span id="display-mobile"></span></p>
        <hr>
        <h3>Add New Product</h3>
        <input type="text" id="p-name" placeholder="Product Name (e.g. Apple)">
        <input type="text" id="p-price" placeholder="Wholesale Price (₹)">
        <input type="text" id="p-sku" placeholder="SKU Code">
        <button onclick="publishProduct()">Publish Product to Live Cloud</button>
        <button onclick="logoutVendor()" class="secondary-btn">Logout</button>
        <p id="status-msg" style="color:green;"></p>
    </div>

<script>
    // Firebase Database URL
    const firebaseConfig = {
        databaseURL: "https://viziamart-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let activeMobile = "";

    function showRegister() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('register-section').classList.remove('hidden');
    }

    function showLogin() {
        document.getElementById('register-section').classList.add('hidden');
        document.getElementById('login-section').classList.remove('hidden');
    }

    // नया वेंडर रजिस्टर करके अपना खुद का पिन सेट करेगा
    function registerVendor() {
        let companyName = document.getElementById('reg-company').value.trim();
        let mobile = document.getElementById('reg-mobile').value.trim();
        let pin = document.getElementById('reg-pin').value.trim();

        if(!companyName || mobile.length !== 10 || !pin) {
            document.getElementById('reg-error').innerText = "कृपया सभी जानकारी सही से भरें।";
            return;
        }

        db.ref('registered_vendors/' + mobile).set({
            companyName: companyName,
            mobile: mobile,
            secretPin: pin
        }).then(() => {
            alert("रजिस्ट्रेशन सफल! अब आप अपने पिन से लॉगिन कर सकते हैं।");
            showLogin();
        }).catch((error) => {
            document.getElementById('reg-error').innerText = "Error: " + error.message;
        });
    }

    // वेंडर अपने मोबाइल और पिन से लॉगिन करेगा
    function loginVendor() {
        let mobile = document.getElementById('login-mobile').value.trim();
        let pin = document.getElementById('login-pin').value.trim();

        if (mobile.length !== 10) {
            document.getElementById('login-error').innerText = "कृपया सही मोबाइल नंबर डालें।";
            return;
        }

        db.ref('registered_vendors/' + mobile).once('value')
            .then((snapshot) => {
                let data = snapshot.val();
                if (data && data.secretPin === pin) {
                    activeMobile = mobile;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('admin-section').classList.remove('hidden');
                    document.getElementById('display-company-name').innerText = data.companyName;
                    document.getElementById('display-mobile').innerText = mobile;
                } else {
                    document.getElementById('login-error').innerText = "गलत मोबाइल नंबर या पासवर्ड!";
                }
            })
            .catch((error) => {
                document.getElementById('login-error').innerText = "Error: " + error.message;
            });
    }

    // प्रोडक्ट पब्लिश करना (सिर्फ उसी वेंडर के फोल्डर में जाएगा)
    function publishProduct() {
        if (!activeMobile) return;

        let name = document.getElementById('p-name').value;
        let price = document.getElementById('p-price').value;
        let sku = document.getElementById('p-sku').value;

        if(!name || !price) {
            alert("कृपया प्रोडक्ट का नाम और कीमत भरें।");
            return;
        }

        let productData = {
            productName: name,
            price: price,
            sku: sku,
            sellerMobile: activeMobile,
            timestamp: Date.now()
        };

        // डेटाबेस में उस वेंडर के मोबाइल फोल्डर के अंदर प्रोडक्ट सेव होगा
        db.ref('vendors_products/' + activeMobile).push(productData)
            .then(() => {
                document.getElementById('status-msg').innerText = "Product Published Successfully!";
                document.getElementById('p-name').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-sku').value = '';
            })
            .catch((error) => {
                alert("Error: " + error.message);
            });
    }

    function logoutVendor() {
        location.reload();
    }
</script>

</body>
</html>
