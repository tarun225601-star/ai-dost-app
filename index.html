<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viziya - 2050 Living Mirror</title>
    <style>
        :root {
            --bg-color: #05070b;
            --surface-color: #0b0f19;
            --neon-glow: #00f0ff;
            --accent-purple: #b000ff;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* Full Screen App Shell */
        .app-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            position: relative;
        }

        /* Top App Bar */
        .app-header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(45deg, var(--neon-glow), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--neon-glow);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        /* Scrollable Main Content Area */
        .main-content {
            flex: 1;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 70px;
        }

        /* Card Section */
        .card {
            width: 100%;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 13px;
            color: var(--neon-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        /* Inputs & Buttons */
        .input-field {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
        }

        .input-field:focus {
            border-color: var(--neon-glow);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-glow), #0077ff);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        /* Feed Post Layout */
        .post-card {
            background: #0b0f19;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .post-header {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-glow), var(--accent-purple));
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .post-media {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            display: block;
        }

        .post-footer {
            padding: 12px;
            font-size: 13px;
            color: #e2e8f0;
        }

        /* Bottom Navigation Bar (Real App Style) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(11, 15, 25, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--neon-glow);
        }

        .nav-item span {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Top App Bar -->
        <header class="app-header">
            <h1 class="logo-title">VIZIYA</h1>
            <div class="header-icons">
                <div class="icon-btn" onclick="alert('Mirror Call Gateway Active')">⚡</div>
                <div class="icon-btn" onclick="alert('Settings Panel')">⚙️</div>
            </div>
        </header>

        <!-- Main Dynamic Feed & Controls -->
        <div class="main-content">
            <!-- Create Post Box -->
            <div class="card">
                <div class="card-title">✨ Create Live Feed Post</div>
                <input type="text" id="postMediaUrl" class="input-field" placeholder="Paste Image / Video URL...">
                <input type="text" id="postCaption" class="input-field" placeholder="Write caption for 2050 feed...">
                <button class="btn btn-primary" onclick="publishPost()">Publish Real Post</button>
            </div>

            <!-- Feed Stream -->
            <div id="liveFeedStream">
                <!-- Dynamically loaded posts -->
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-item active"><span>🏠</span>Home</button>
            <button class="nav-item" onclick="alert('Discover / Search')"><span>🔍</span>Explore</button>
            <button class="nav-item" onclick="alert('Mirror Calls')"><span>🪞</span>Mirror</button>
            <button class="nav-item" onclick="alert('User Profile')"><span>👤</span>Profile</button>
        </nav>
    </div>

    <script>
        let posts = JSON.parse(localStorage.getItem('vizia_real_posts')) || [
            { user: 'Tarun Viziya', handle: '@viziya_global', media: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600', caption: 'Full screen real layout active! 2050 Vibe 🚀' }
        ];

        window.onload = () => {
            renderFeed();
        };

        function publishPost() {
            const mediaUrl = document.getElementById('postMediaUrl').value.trim();
            const caption = document.getElementById('postCaption').value.trim();

            if(!mediaUrl && !caption) {
                alert("Please enter media URL or caption.");
                return;
            }

            const newPost = {
                user: 'Tarun Viziya',
                handle: '@viziya_global',
                media: mediaUrl || 'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=600',
                caption: caption || 'Viziya Live Stream Drop'
            };

            posts.unshift(newPost);
            localStorage.setItem('vizia_real_posts', JSON.stringify(posts));

            document.getElementById('postMediaUrl').value = '';
            document.getElementById('postCaption').value = '';
            renderFeed();
        }

        function renderFeed() {
            const container = document.getElementById('liveFeedStream');
            container.innerHTML = '';
            posts.forEach(p => {
                container.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-user-info">
                                <div class="avatar-circle">${p.user.charAt(0)}</div>
                                <div>
                                    <strong style="font-size: 13px; display: block; color: #fff;">${p.user}</strong>
                                    <span style="font-size: 10px; color: var(--neon-glow);">${p.handle}</span>
                                </div>
                            </div>
                            <span style="color: var(--text-muted); font-size: 12px;">• • •</span>
                        </div>
                        <img src="${p.media}" class="post-media" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'">
                        <div class="post-footer">
                            <strong style="color: #fff; margin-right: 6px;">${p.user}</strong>${p.caption}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
