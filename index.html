<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viziya - Ultimate AI & Live Media Mirror</title>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #05070b;
            --surface-color: #0b0f19;
            --neon-glow: #00f0ff;
            --accent-purple: #b000ff;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        .app-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top App Bar */
        .app-header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(45deg, var(--neon-glow), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-icons {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--neon-glow);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        /* Main Scrollable View */
        .main-content {
            flex: 1;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 80px;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .card-title {
            font-size: 13px;
            color: var(--neon-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .camera-box {
            width: 100%;
            height: 240px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--neon-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #realCameraStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
        }

        .input-field:focus {
            border-color: var(--neon-glow);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-glow), #0077ff);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        /* Post Card Styles */
        .post-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .post-header {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-glow), var(--accent-purple));
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .post-media {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            display: block;
            background: #000;
        }

        .post-footer {
            padding: 12px;
            font-size: 13px;
            color: #e2e8f0;
        }

        /* Master Settings Modal Panel */
        #settingsModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 11, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            width: 100%;
            max-width: 420px;
            background: var(--surface-color);
            border: 1px solid var(--neon-glow);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.3);
            margin: auto;
        }

        .field-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        .save-msg {
            font-size: 11px;
            color: #10b981;
            text-align: center;
            margin-top: 8px;
            display: none;
        }

        /* Bottom Real Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(11, 15, 25, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--neon-glow);
        }

        .nav-item span {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Top App Bar -->
        <header class="app-header">
            <h1 class="logo-title">VIZIYA</h1>
            <div class="header-icons">
                <div class="icon-btn" onclick="initRealCamera()" title="Start Camera">📷</div>
                <div class="icon-btn" onclick="openSettingsModal()" title="Master Settings">⚙️</div>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="main-content">
            
            <!-- 1. Real Camera Mirror Box -->
            <div class="card">
                <div class="card-title">🪞 Live Empathic Mirror Stream</div>
                <div class="camera-box">
                    <video id="realCameraStream" autoplay playsinline muted></video>
                </div>
                <button class="btn btn-primary" style="margin-top: 12px;" onclick="initRealCamera()">Start Camera Feed</button>
            </div>

            <!-- 2. Direct Gallery Media Upload -->
            <div class="card">
                <div class="card-title">✨ Direct Gallery Media Upload (Supabase Cloud)</div>
                <input type="file" id="realMediaFile" class="input-field" accept="image/*,video/*" style="padding: 10px; background: #000; border-style: dashed;">
                <input type="text" id="postCaption" class="input-field" placeholder="Write caption for your media...">
                <button class="btn btn-primary" onclick="publishDirectMedia()">Post to Cloud Feed</button>
            </div>

            <!-- 3. Live Cloud Feed Stream -->
            <div id="realFeedContainer"></div>
        </div>

        <!-- Master Settings Modal Panel (All APIs & Keys) -->
        <div id="settingsModal">
            <div class="modal-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="color: var(--neon-glow); font-size: 15px;">⚙️ Master API Gateway</h3>
                    <button onclick="closeSettingsModal()" style="background:none; border:none; color:#ff4d4d; font-size:20px; cursor:pointer;">✕</button>
                </div>
                
                <div style="margin-bottom: 10px;">
                    <span class="field-label">1. Supabase Project URL</span>
                    <input type="text" id="cfgSupabaseUrl" class="input-field" placeholder="https://xyz.supabase.co">
                </div>

                <div style="margin-bottom: 10px;">
                    <span class="field-label">2. Supabase Anon / Public Key</span>
                    <input type="text" id="cfgSupabaseKey" class="input-field" placeholder="eyJhbGciOiJIUzI1NiIsIn...">
                </div>

                <div style="margin-bottom: 10px;">
                    <span class="field-label">3. Agora App ID / SDK Key (Starts & ends with 4)</span>
                    <input type="text" id="cfgAgoraId" class="input-field" placeholder="Enter Agora App ID...">
                </div>

                <div style="margin-bottom: 15px;">
                    <span class="field-label">4. Grok AI API Key</span>
                    <input type="text" id="cfgGrokKey" class="input-field" placeholder="xai-...">
                </div>

                <button class="btn btn-primary" onclick="saveAllMasterKeys()">Save All Keys Permanently</button>
                <div id="saveMsg" class="save-msg">✓ All Master Keys Saved Successfully!</div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active"><span>🏠</span>Home</button>
            <button class="nav-item" onclick="initRealCamera()"><span>🪞</span>Mirror</button>
            <button class="nav-item" onclick="openSettingsModal()"><span>⚙️</span>Settings</button>
        </nav>
    </div>

    <script>
        let supabaseClient = null;

        function initMasterConfigs() {
            const url = localStorage.getItem('viziya_supabase_url');
            const key = localStorage.getItem('viziya_supabase_key');
            if (url && key) {
                try {
                    supabaseClient = window.supabase.createClient(url, key);
                    fetchCloudPosts();
                } catch (e) {
                    console.error("Supabase init error:", e);
                }
            }
        }

        // --- Settings Modal Logic ---
        function openSettingsModal() {
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('cfgSupabaseUrl').value = localStorage.getItem('viziya_supabase_url') || '';
            document.getElementById('cfgSupabaseKey').value = localStorage.getItem('viziya_supabase_key') || '';
            document.getElementById('cfgAgoraId').value = localStorage.getItem('viziya_agora_id') || '';
            document.getElementById('cfgGrokKey').value = localStorage.getItem('viziya_grok_key') || '';
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveAllMasterKeys() {
            const url = document.getElementById('cfgSupabaseUrl').value.trim();
            const key = document.getElementById('cfgSupabaseKey').value.trim();
            const agoraId = document.getElementById('cfgAgoraId').value.trim();
            const grokKey = document.getElementById('cfgGrokKey').value.trim();

            if (!url || !key) {
                alert("Supabase URL and Key are required for database feed!");
                return;
            }

            localStorage.setItem('viziya_supabase_url', url);
            localStorage.setItem('viziya_supabase_key', key);
            localStorage.setItem('viziya_agora_id', agoraId);
            localStorage.setItem('viziya_grok_key', grokKey);

            const msg = document.getElementById('saveMsg');
            msg.style.display = 'block';
            
            setTimeout(() => {
                msg.style.display = 'none';
                closeSettingsModal();
                initMasterConfigs();
            }, 1500);
        }

        // --- Real Camera Stream Logic ---
        async function initRealCamera() {
            try {
                const videoElement = document.getElementById('realCameraStream');
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                videoElement.srcObject = stream;
            } catch (err) {
                console.log("Camera notice: " + err.message);
            }
        }

        // --- Direct Gallery File Upload & Supabase Sync ---
        window.onload = () => {
            initRealCamera();
            initMasterConfigs();
        };

        function publishDirectMedia() {
            if (!supabaseClient) {
                alert("Please configure your Supabase settings in the ⚙️ panel first!");
                openSettingsModal();
                return;
            }

            const fileInput = document.getElementById('realMediaFile');
            const caption = document.getElementById('postCaption').value.trim();

            if (fileInput.files.length === 0) {
                alert("Please select a photo or video from your device storage!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const base64Data = e.target.result;
                const isVideo = file.type.startsWith('video');

                const newPost = {
                    user_name: 'Tarun Viziya',
                    handle: '@viziya_global',
                    media_url: base64Data,
                    media_type: isVideo ? 'video' : 'image',
                    caption: caption || 'Direct live gallery drop 🚀'
                };

                try {
                    const { data, error } = await supabaseClient
                        .from('posts')
                        .insert([newPost]);

                    if (error) {
                        alert("Supabase Error: " + error.message + "\n(Make sure 'posts' table exists in Supabase)");
                    } else {
                        document.getElementById('postCaption').value = '';
                        fileInput.value = '';
                        fetchCloudPosts();
                    }
                } catch (err) {
                    alert("Upload failed: " + err.message);
                }
            };

            reader.readAsDataURL(file);
        }

        async function fetchCloudPosts() {
            const container = document.getElementById('realFeedContainer');
            
            if (!supabaseClient) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px;">Configure Supabase in settings to view cloud feed.</div>`;
                return;
            }

            try {
                const { data: posts, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('id', { ascending: false });

                if (error || !posts || posts.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px;">No cloud posts found yet. Post something above!</div>`;
                    return;
                }

                container.innerHTML = '';
                posts.forEach(p => {
                    let mediaHtml = p.media_type === 'video' 
                        ? `<video src="${p.media_url}" class="post-media" controls autoplay loop muted playsinline></video>`
                        : `<img src="${p.media_url}" class="post-media">`;

                    container.innerHTML += `
                        <div class="post-card">
                            <div class="post-header">
                                <div class="avatar-circle">${p.user_name ? p.user_name.charAt(0) : 'T'}</div>
                                <div>
                                    <strong style="font-size: 13px; display: block; color: #fff;">${p.user_name || 'User'}</strong>
                                    <span style="font-size: 10px; color: var(--neon-glow);">${p.handle || '@viziya'}</span>
                                </div>
                            </div>
                            ${mediaHtml}
                            <div class="post-footer">
                                <strong style="color: #fff; margin-right: 6px;">${p.user_name || 'User'}</strong>${p.caption || ''}
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }
    </script>
</body>
</html>
